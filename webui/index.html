<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kronos 股票预测</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f5f5f5; color: #333; }
  .container { max-width: 960px; margin: 0 auto; padding: 20px; }
  h1 { text-align: center; margin: 30px 0 20px; font-size: 24px; color: #1a1a1a; }
  .form-card { background: #fff; border-radius: 12px; padding: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); margin-bottom: 20px; }
  .form-row { display: flex; gap: 12px; align-items: end; flex-wrap: wrap; }
  .form-group { display: flex; flex-direction: column; }
  .form-group label { font-size: 13px; color: #666; margin-bottom: 4px; }
  .form-group input { padding: 8px 12px; border: 1px solid #ddd; border-radius: 6px; font-size: 14px; width: 140px; }
  .form-group input:focus { outline: none; border-color: #4a90d9; box-shadow: 0 0 0 2px rgba(74,144,217,0.15); }
  button { padding: 8px 24px; background: #4a90d9; color: #fff; border: none; border-radius: 6px; font-size: 14px; cursor: pointer; }
  button:hover { background: #357abd; }
  button:disabled { background: #aaa; cursor: not-allowed; }
  .stats { display: flex; gap: 20px; margin-bottom: 20px; flex-wrap: wrap; }
  .stat-card { background: #fff; border-radius: 8px; padding: 16px 24px; box-shadow: 0 1px 4px rgba(0,0,0,0.06); min-width: 160px; }
  .stat-card .label { font-size: 12px; color: #999; }
  .stat-card .value { font-size: 22px; font-weight: 600; margin-top: 4px; }
  .stat-card .value.up { color: #e74c3c; }
  .stat-card .value.down { color: #27ae60; }
  .chart-card { background: #fff; border-radius: 12px; padding: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; }
  .chart-card img { max-width: 100%; border-radius: 8px; }
  .loading { display: none; text-align: center; padding: 40px; color: #999; }
  .loading.show { display: block; }
  .error { display: none; background: #fee; color: #c00; padding: 12px; border-radius: 8px; margin-bottom: 20px; }
  .error.show { display: block; }
</style>
</head>
<body>
<div class="container">
  <h1>Kronos 股票走势预测</h1>
  <div class="form-card">
    <div class="form-row">
      <div class="form-group">
        <label>股票代码</label>
        <input type="text" id="stockCode" placeholder="例: 601138" value="601138">
      </div>
      <div class="form-group">
        <label>历史K线数</label>
        <input type="number" id="historyBars" value="200" min="50" max="500">
      </div>
      <div class="form-group">
        <label>预测K线数</label>
        <input type="number" id="predictBars" value="48" min="1" max="120">
      </div>
      <button id="submitBtn" onclick="doPredict()">预测</button>
    </div>
  </div>
  <div class="error" id="errorMsg"></div>
  <div class="stats" id="statsArea" style="display:none">
    <div class="stat-card"><div class="label">股票代码</div><div class="value" id="statCode">-</div></div>
    <div class="stat-card"><div class="label">最新价</div><div class="value" id="statLatest">-</div></div>
    <div class="stat-card"><div class="label">预测收盘价</div><div class="value" id="statPred">-</div></div>
    <div class="stat-card"><div class="label">涨跌幅</div><div class="value" id="statChange">-</div></div>
  </div>
  <div class="loading" id="loading">
    <svg width="40" height="40" viewBox="0 0 40 40"><circle cx="20" cy="20" r="16" stroke="#ddd" stroke-width="4" fill="none"/><circle cx="20" cy="20" r="16" stroke="#4a90d9" stroke-width="4" fill="none" stroke-dasharray="80" stroke-dashoffset="60"><animateTransform attributeName="transform" type="rotate" from="0 20 20" to="360 20 20" dur="1s" repeatCount="indefinite"/></circle></svg>
    <p style="margin-top:12px">正在获取数据并预测...</p>
  </div>
  <div class="chart-card" id="chartArea" style="display:none">
    <img id="chartImg" src="" alt="Prediction Chart">
  </div>
</div>
<script>
async function doPredict() {
  const code = document.getElementById("stockCode").value.trim();
  if (!code) { alert("请输入股票代码"); return; }
  const hist = parseInt(document.getElementById("historyBars").value) || 200;
  const pred = parseInt(document.getElementById("predictBars").value) || 48;
  const btn = document.getElementById("submitBtn");
  const loading = document.getElementById("loading");
  const chartArea = document.getElementById("chartArea");
  const statsArea = document.getElementById("statsArea");
  const error = document.getElementById("errorMsg");
  btn.disabled = true; loading.classList.add("show");
  chartArea.style.display = "none"; statsArea.style.display = "none"; error.classList.remove("show");
  try {
    const res = await fetch("/api/predict", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ stock_code: code, history_bars: hist, predict_bars: pred }),
    });
    const data = await res.json();
    if (data.error) { error.textContent = "预测失败: " + data.error; error.classList.add("show"); return; }
    document.getElementById("statCode").textContent = data.stock_code;
    document.getElementById("statLatest").textContent = data.latest_close;
    document.getElementById("statPred").textContent = data.pred_close;
    const changeEl = document.getElementById("statChange");
    changeEl.textContent = (data.change_pct >= 0 ? "+" : "") + data.change_pct + "%";
    changeEl.className = "value " + (data.change_pct >= 0 ? "up" : "down");
    document.getElementById("chartImg").src = "data:image/png;base64," + data.chart;
    chartArea.style.display = "block"; statsArea.style.display = "flex";
  } catch (e) {
    error.textContent = "请求失败: " + e.message; error.classList.add("show");
  } finally {
    btn.disabled = false; loading.classList.remove("show");
  }
}
</script>
</body>
</html>
